name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  variants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - name: Generate and verify every combination
        run: bun run check
        env:
          CHECK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
